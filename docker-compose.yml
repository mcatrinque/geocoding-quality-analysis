# Repositório de endereços de referência: PostGIS e API.
# As credenciais vêm do arquivo .env (copie de .env.example); o compose
# falha com mensagem explícita se elas não estiverem definidas.
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: cnefe_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env, copiando de .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env, copiando de .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env, copiando de .env.example}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: cnefe_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Sem API_KEYS o acesso é aberto, que é o padrão da prova de conceito.
      # Formato: "chave1:cliente1,chave2:cliente2"
      API_KEYS: ${API_KEYS:-}
      # Zero desliga o limite de requisições por minuto por cliente
      LIMITE_POR_MINUTO: ${LIMITE_POR_MINUTO:-0}
      LIMIAR_SIMILARIDADE: ${LIMIAR_SIMILARIDADE:-0.30}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgis_data:
